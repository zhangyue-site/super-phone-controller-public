name: Build Flutter app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '构建目标'
        required: true
        default: android
        type: choice
        options: [android, ios, both]
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-build.yml'

jobs:
  android:
    # Android 在 ubuntu 上构建，公开仓库免费，私有仓库按实际分钟计费。
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Regression tests
        run: flutter test

      - name: Build community debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: community-debug-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    # macOS runner 按 10 倍计费：跑 1 分钟扣 10 分钟额度。
    # 因此只在显式选择 ios 时构建，绝不挂在 push 上。
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS app
        run: |
          # 不签名只出 .app，用于验证真机可编译。要装到手机需在本地
          # 用开发者证书重签，或配好 provisioning profile 后改 --export-method。
          flutter build ios --release --no-codesign

      - name: Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/pcflash-ios.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: pcflash-ios
          path: pcflash-ios.ipa
          if-no-files-found: error
