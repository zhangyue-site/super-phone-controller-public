dependencies:
  # IDF 6.0 把 gpio/i2c 从 driver 拆到 esp_driver_*；esp_codec_dev 1.3.x
  # 不声明这些依赖，编 audio_codec_gpio.c 时直接找不到 driver/gpio.h。
  # 1.6.2 起修好了，见 espressif/esp_codec_dev release notes。
  espressif/esp_codec_dev: "^1.6.2"
  espressif/esp_tinyusb: "^2.0.0"
  espressif/usb:
    version: "^1.1.0"
    rules:
      - if: "idf_version >=6.0"
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"
  idf: ">=5.5"
